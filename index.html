<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spelling Hive</title>
  <meta name="description" content="Spelling Hive: hear the word, type it, and build your spelling.">
  <meta name="color-scheme" content="light">
  <!-- The spelling words are the lesson: keep auto-translate extensions away. -->
  <meta name="google" content="notranslate">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%90%9D%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="bar"><span class="brand">Spelling Hive</span></header>
  <main id="app">
    <h1>Spelling Hive</h1>
    <p class="muted" id="loading">Loading…</p>
  </main>
  <div id="toasts" aria-live="assertive"></div>
  <div id="modal-root"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <noscript><p style="text-align:center;padding:2rem">This app needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/main.js"></script>
  <script>
    // If the app hasn't started after a while (bad connection, stale files), offer a reload.
    setTimeout(function () {
      if (window.__spellingHiveStarted) return;
      var t = document.getElementById('loading');
      if (t) t.innerHTML = 'Loading slowly… <button onclick="location.reload()">Reload</button>';
    }, 7000);
  </script>
</body>
</html>
